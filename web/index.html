<!doctype html>
<html lang="en" data-theme="zine" data-font="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>vidshare</title>
  <!-- Lets the app be added to a phone's home screen and open full-screen like an app. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta id="app-title" name="apple-mobile-web-app-title" content="vidshare">
  <meta id="theme-color" name="theme-color" content="#efe8d8">
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js"></script>
  <script src="/prefs.js"></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <header class="top">
      <div class="brand">
        <h1 id="brand">vidshare</h1>
        <button id="open-style" type="button" class="icon" data-i18n-aria="style.open" title="">✎</button>
        <!-- Shown the first time, and now and then after that, until the pencil has been used. -->
        <div id="pencil-hint" class="hint" role="status" hidden>
          <div id="hint-mascot" class="hint-mascot"></div>
          <p data-i18n="hint.pencil"></p>
          <button id="hint-close" type="button" class="hint-close" data-i18n-aria="hint.close">×</button>
        </div>
      </div>
      <div class="tools">
        <!-- One small button: shows the current language, a tap switches to the other. -->
        <button id="lang-toggle" type="button" class="chip" data-i18n-aria="lang.switch"></button>
        <nav id="nav" class="menu" hidden>
          <button id="menu-button" type="button" class="chip" aria-haspopup="true" aria-expanded="false"
                  aria-controls="menu-panel" data-i18n-aria="nav.menu">☰</button>
          <div id="menu-panel" class="menu-panel" hidden>
            <p id="who" class="muted"></p>
            <button id="open-devices" type="button" class="quiet" data-i18n="nav.devices"></button>
            <button id="open-accounts" type="button" class="quiet" data-i18n="acc.title"></button>
            <button id="open-admin" type="button" class="quiet" data-i18n="nav.adminPanel" hidden></button>
            <button id="sign-out" type="button" class="quiet" data-i18n="nav.signout"></button>
          </div>
        </nav>
      </div>
    </header>

    <div class="ticker" aria-hidden="true"><div id="ticker" class="ticker-track"></div></div>

    <!-- Name, lettering and colors -->
    <section id="style-panel" class="card" hidden>
      <h2 data-i18n="style.title"></h2>
      <label for="style-name" data-i18n="style.name"></label>
      <input id="style-name" type="text" maxlength="24" autocomplete="off" spellcheck="false">
      <p class="muted" data-i18n="style.nameHelp"></p>
      <p class="label" data-i18n="style.font"></p>
      <div id="style-fonts" class="choices">
        <button type="button" data-font="unbounded" class="font-unbounded">Unbounded</button>
        <button type="button" data-font="syne" class="font-syne">Syne</button>
        <button type="button" data-font="warp" class="font-warp">Tilt Warp</button>
        <button type="button" data-font="glitch" class="font-glitch">Glitch</button>
        <button type="button" data-font="mono" class="font-mono">Rubik Mono</button>
        <button type="button" data-font="fredoka" class="font-fredoka">Fredoka</button>
        <button type="button" data-font="bangers" class="font-bangers">Bangers</button>
        <button type="button" data-font="audiowide" class="font-audiowide">Audiowide</button>
        <button type="button" data-font="win" class="font-win">System</button>
      </div>
      <p class="label" data-i18n="style.theme"></p>
      <div id="style-themes" class="choices">
        <button type="button" data-theme-pick="void" class="swatch swatch-void" data-i18n="theme.void"></button>
        <button type="button" data-theme-pick="acid" class="swatch swatch-acid" data-i18n="theme.acid"></button>
        <button type="button" data-theme-pick="sunset" class="swatch swatch-sunset" data-i18n="theme.sunset"></button>
        <button type="button" data-theme-pick="zine" class="swatch swatch-zine" data-i18n="theme.zine"></button>
        <button type="button" data-theme-pick="clay" class="swatch swatch-clay" data-i18n="theme.clay"></button>
        <button type="button" data-theme-pick="win95" class="swatch swatch-win95" data-i18n="theme.win95"></button>
        <button type="button" data-theme-pick="comic" class="swatch swatch-comic" data-i18n="theme.comic"></button>
        <button type="button" data-theme-pick="vapor" class="swatch swatch-vapor" data-i18n="theme.vapor"></button>
      </div>
      <p class="label" data-i18n="scn.title"></p>
      <div id="style-scenes" class="choices">
        <button type="button" data-scene="random" data-i18n="scn.random"></button>
        <button type="button" data-scene="demolition" data-i18n="scn.demolition"></button>
        <button type="button" data-scene="compressor" data-i18n="scn.compressor"></button>
        <button type="button" data-scene="voyage" data-i18n="scn.voyage"></button>
        <button type="button" data-scene="none" data-i18n="scn.none"></button>
      </div>
      <div id="scene-preview" class="scene-canvas" hidden></div>
      <div id="scene-motion-row" class="checks" hidden>
        <label for="scene-motion"><input id="scene-motion" type="checkbox"><span data-i18n="scn.always"></span></label>
      </div>
      <button id="close-style" type="button" data-i18n="style.done"></button>
    </section>

    <!-- Signed out -->
    <section id="auth" class="card" hidden>
      <div id="signin-box">
        <h2 id="signin-title"></h2>
        <p id="signin-help" class="muted"></p>
        <button id="sign-in" type="button" data-i18n="auth.signin"></button>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <form id="join" autocomplete="off">
        <h2 id="join-title"></h2>
        <p id="join-help" class="muted"></p>
        <label for="join-code" data-i18n="join.code"></label>
        <input id="join-code" type="text" required placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false">
        <label for="join-name" data-i18n="join.deviceName"></label>
        <input id="join-name" type="text" required maxlength="60">
        <button id="join-submit" type="submit" class="secondary" data-i18n="join.submit"></button>
        <button id="join-cancel" type="button" class="quiet" data-i18n="join.cancel" hidden></button>
      </form>
    </section>

    <!-- Signed in -->
    <div id="app" hidden>
      <form id="lookup" class="card" autocomplete="off">
        <label for="url" data-i18n="link.label"></label>
        <div class="row">
          <input id="url" name="url" type="url" inputmode="url" required data-i18n-ph="link.placeholder">
          <button id="paste" type="button" class="secondary" data-i18n="link.paste" hidden></button>
          <button id="lookup-button" type="submit" data-i18n="link.lookup"></button>
        </div>
        <p id="lookup-error" class="error" role="alert" hidden></p>
      </form>

      <!-- One step shows at a time here: pick a size, then progress, then the finished file. -->
      <div id="stage">
        <section id="media" class="card" hidden aria-live="polite">
          <div class="media-head">
            <img id="thumb" alt="" referrerpolicy="no-referrer">
            <div>
              <h2 id="title" tabindex="-1"></h2>
              <p id="meta" class="muted"></p>
              <p id="experimental" class="note" data-i18n="media.experimental" hidden></p>
            </div>
          </div>
          <form id="make">
            <fieldset>
              <legend data-i18n="media.pick"></legend>
              <div id="presets"></div>
            </fieldset>
            <button id="make-button" type="submit" class="big" data-i18n="media.make"></button>
            <p id="make-error" class="error" role="alert" hidden></p>
          </form>
        </section>

        <section id="job" class="card" hidden aria-live="polite">
          <p id="job-title" class="muted"></p>
          <div id="scene" class="scene" hidden>
            <div id="scene-canvas" class="scene-canvas"></div>
            <p id="scene-note" class="scene-note muted" hidden>
              <span data-i18n="scn.calm"></span>
              <button id="scene-full" type="button" class="quiet" data-i18n="scn.full"></button>
            </p>
          </div>
          <p id="percent" class="percent" tabindex="-1">0%</p>
          <p id="stage-text"></p>
          <div class="meter"><div id="bar" class="meter-fill"></div></div>
          <button id="cancel" type="button" class="quiet" data-i18n="job.cancel"></button>
        </section>

        <section id="result" class="card" hidden aria-live="polite">
          <h2 id="result-title" tabindex="-1"></h2>
          <p id="result-name"></p>
          <p id="result-meta" class="muted"></p>
          <div id="player"></div>
          <div class="actions">
            <button id="share" type="button" data-i18n="res.share" hidden></button>
            <a id="download" class="button" href="#" data-i18n="res.download"></a>
            <button id="link" type="button" class="secondary" data-i18n="res.link"></button>
          </div>
          <p id="share-note" class="muted" hidden></p>
          <div id="link-box" class="row" hidden>
            <label for="link-url" class="sr" data-i18n="res.linkLabel"></label>
            <input id="link-url" type="text" readonly>
            <button id="copy" type="button" class="secondary" data-i18n="copy"></button>
          </div>
          <p id="link-note" class="muted" hidden></p>
          <div class="actions next">
            <button id="again" type="button" class="quiet" data-i18n="res.another"></button>
            <button id="new-link" type="button" class="spark" data-i18n="res.new"></button>
          </div>
        </section>
      </div>

      <section id="recent" class="card" hidden>
        <h2 data-i18n="recent.title"></h2>
        <ul id="recent-list" class="rows"></ul>
      </section>
    </div>

    <!-- Devices and people -->
    <div id="devices" hidden>
      <button id="close-devices" type="button" class="quiet" data-i18n="dev.back"></button>
      <p id="devices-error" class="error" role="alert" hidden></p>

      <section class="card">
        <h2 data-i18n="dev.yours"></h2>
        <p class="muted" data-i18n="dev.yoursHelp"></p>
        <ul id="passkey-list" class="rows"></ul>
        <button id="add-device" type="button" data-i18n="dev.add"></button>
        <div id="invite-box" hidden>
          <p id="invite-help"></p>
          <img id="invite-qr" data-i18n-alt="dev.qrAlt" alt="" width="220" height="220">
          <p><span data-i18n="dev.orType"></span> <strong id="invite-code" class="code"></strong></p>
          <p><span data-i18n="dev.orLink"></span> <a id="invite-link" target="_blank" rel="noopener"></a></p>
          <button id="invite-copy" type="button" class="quiet" data-i18n="dev.copyLink"></button>
          <p id="invite-expiry" class="muted"></p>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="tok.title"></h2>
        <p class="muted" data-i18n="tok.help"></p>
        <ul id="token-list" class="rows"></ul>
        <form id="token-form" class="row" autocomplete="off">
          <label for="token-name" class="sr" data-i18n="tok.nameLabel"></label>
          <input id="token-name" type="text" required maxlength="60" data-i18n-ph="tok.placeholder">
          <button type="submit" class="secondary" data-i18n="tok.create"></button>
        </form>
        <div id="token-box" hidden>
          <p class="note" data-i18n="tok.copyNow"></p>
          <div class="row">
            <label for="token-value" class="sr" data-i18n="tok.valueLabel"></label>
            <input id="token-value" type="text" readonly>
            <button id="token-copy" type="button" class="secondary" data-i18n="copy"></button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="out.title"></h2>
        <p class="muted" data-i18n="out.help"></p>
        <button id="sign-out-all" type="button" class="quiet" data-i18n="out.title"></button>
      </section>
    </div>
    <!-- Connected accounts: each person's own cookie files -->
    <div id="accounts" hidden>
      <button id="close-accounts" type="button" class="quiet" data-i18n="dev.back"></button>
      <p id="accounts-error" class="error" role="alert" hidden></p>
      <p id="accounts-ok" class="note" role="status" hidden></p>

      <section class="card">
        <h2 data-i18n="acc.title"></h2>
        <p class="muted" data-i18n="acc.optional"></p>
        <ul id="accounts-list" class="rows"></ul>
      </section>

      <section class="card">
        <h2 data-i18n="acc.aboutTitle"></h2>
        <dl class="explain">
          <div><dt data-i18n="acc.whyQ"></dt><dd data-i18n="acc.whyA"></dd></div>
          <div><dt data-i18n="acc.whoQ"></dt><dd data-i18n="acc.whoA"></dd></div>
          <div><dt data-i18n="acc.skipQ"></dt><dd data-i18n="acc.skipA"></dd></div>
          <div><dt data-i18n="acc.tipQ"></dt><dd data-i18n="acc.tipA"></dd></div>
        </dl>
      </section>

      <section class="card">
        <h2 data-i18n="acc.howTitle"></h2>
        <ol class="steps">
          <li data-i18n="acc.how1"></li>
          <li data-i18n="acc.how2"></li>
          <li data-i18n="acc.how3"></li>
          <li data-i18n="acc.how4"></li>
        </ol>
        <p class="muted" data-i18n="acc.onceNote"></p>
        <p class="muted" data-i18n="acc.howNote"></p>
      </section>
    </div>

    <!-- Admin panel (admins only) -->
    <div id="admin" hidden>
      <button id="close-admin" type="button" class="quiet" data-i18n="dev.back"></button>
      <div id="admin-tabs" class="tabs">
        <button type="button" class="chip" data-tab="overview" data-i18n="adm.tab.overview"></button>
        <button type="button" class="chip" data-tab="videos" data-i18n="adm.tab.videos"></button>
        <button type="button" class="chip" data-tab="links" data-i18n="adm.tab.links"></button>
        <button type="button" class="chip" data-tab="people" data-i18n="ppl.title"></button>
        <button type="button" class="chip" data-tab="limits" data-i18n="adm.tab.limits"></button>
        <button type="button" class="chip" data-tab="alerts" data-i18n="adm.tab.alerts"></button>
        <button type="button" class="chip" data-tab="storage" data-i18n="adm.tab.storage"></button>
        <button type="button" class="chip" data-tab="system" data-i18n="adm.tab.system"></button>
        <button type="button" class="chip" data-tab="log" data-i18n="adm.tab.log"></button>
      </div>
      <p id="admin-error" class="error" role="alert" hidden></p>
      <p id="admin-ok" class="note" role="status" hidden></p>

      <section class="card" data-pane="overview">
        <h2 data-i18n="adm.tab.overview"></h2>
        <div id="adm-tiles" class="tiles"></div>
        <div class="actions">
          <button id="adm-pause" type="button" class="secondary"></button>
          <button id="adm-refresh" type="button" class="quiet" data-i18n="adm.refresh"></button>
        </div>
        <p class="muted" data-i18n="adm.pauseHelp"></p>
      </section>

      <section class="card" data-pane="videos" hidden>
        <h2 data-i18n="adm.tab.videos"></h2>
        <label for="adm-job-filter" data-i18n="adm.show"></label>
        <select id="adm-job-filter">
          <option value="" data-i18n="adm.filter.all"></option>
          <option value="failed" data-i18n="adm.status.failed"></option>
          <option value="done" data-i18n="adm.status.done"></option>
          <option value="running" data-i18n="adm.status.running"></option>
          <option value="queued" data-i18n="adm.status.queued"></option>
        </select>
        <ul id="adm-jobs" class="rows"></ul>
        <p id="adm-jobs-empty" class="muted" data-i18n="adm.none" hidden></p>
      </section>

      <section class="card" data-pane="links" hidden>
        <h2 data-i18n="adm.tab.links"></h2>
        <p class="muted" data-i18n="adm.linksHelp"></p>
        <ul id="adm-links" class="rows"></ul>
        <p id="adm-links-empty" class="muted" data-i18n="adm.none" hidden></p>
      </section>

      <section class="card" data-pane="people" hidden>
        <h2 data-i18n="ppl.title"></h2>
        <p class="muted" data-i18n="ppl.help"></p>
        <p class="muted" data-i18n="ppl.adminHelp"></p>
        <ul id="people-list" class="rows"></ul>
        <form id="person-form" class="row" autocomplete="off">
          <label for="person-name" class="sr" data-i18n="ppl.nameLabel"></label>
          <input id="person-name" type="text" required maxlength="40" data-i18n-ph="ppl.placeholder">
          <label for="person-role" class="sr" data-i18n="ppl.roleLabel"></label>
          <select id="person-role">
            <option value="member" data-i18n="ppl.asMember"></option>
            <option value="admin" data-i18n="ppl.asAdmin"></option>
          </select>
          <button type="submit" class="secondary" data-i18n="ppl.invite"></button>
        </form>
        <div id="pinvite-box" class="invite" hidden>
          <p id="pinvite-help"></p>
          <img id="pinvite-qr" class="qr" data-i18n-alt="dev.qrAlt" alt="" width="220" height="220">
          <p><span data-i18n="dev.orType"></span> <strong id="pinvite-code" class="code"></strong></p>
          <p><span data-i18n="dev.orLink"></span> <a id="pinvite-link" target="_blank" rel="noopener"></a></p>
          <button id="pinvite-copy" type="button" class="quiet" data-i18n="dev.copyLink"></button>
          <p id="pinvite-expiry" class="muted"></p>
        </div>
      </section>

      <section class="card" data-pane="limits" hidden>
        <h2 data-i18n="adm.tab.limits"></h2>
        <p class="muted" data-i18n="adm.limitsHelp"></p>
        <form id="adm-limits" autocomplete="off">
          <div id="adm-limit-fields" class="fields"></div>
          <fieldset>
            <legend data-i18n="adm.platforms"></legend>
            <div id="adm-platforms" class="checks"></div>
          </fieldset>
          <button type="submit" data-i18n="adm.save"></button>
        </form>
      </section>

      <section class="card" data-pane="alerts" hidden>
        <h2 data-i18n="adm.tab.alerts"></h2>
        <p class="muted" data-i18n="adm.alertsHelp"></p>
        <form id="adm-alerts" autocomplete="off">
          <div class="fields">
            <label for="adm-ntfy-topic" data-i18n="adm.ntfyTopic"></label>
            <input id="adm-ntfy-topic" type="text" maxlength="64" spellcheck="false" autocapitalize="off">
            <label for="adm-ntfy-url" data-i18n="adm.ntfyUrl"></label>
            <input id="adm-ntfy-url" type="text" spellcheck="false" autocapitalize="off">
            <label for="adm-ntfy-token" data-i18n="adm.ntfyToken"></label>
            <input id="adm-ntfy-token" type="password" autocomplete="off">
          </div>
          <fieldset>
            <legend data-i18n="adm.alertWhen"></legend>
            <div id="adm-events" class="checks"></div>
          </fieldset>
          <div class="actions">
            <button type="submit" data-i18n="adm.save"></button>
            <button id="adm-test-alert" type="button" class="secondary" data-i18n="adm.testAlert"></button>
            <button id="adm-clear-token" type="button" class="quiet" data-i18n="adm.clearToken" hidden></button>
          </div>
        </form>
      </section>

      <section class="card" data-pane="storage" hidden>
        <h2 data-i18n="adm.tab.storage"></h2>
        <p class="muted" data-i18n="sto.help"></p>
        <div id="sto-tiles" class="tiles"></div>
        <div class="actions">
          <button id="sto-use-r2" type="button" data-i18n="sto.useR2"></button>
          <button id="sto-use-local" type="button" class="secondary" data-i18n="sto.useLocal"></button>
        </div>
        <p id="sto-switch-note" class="muted"></p>

        <p class="label" data-i18n="sto.setupTitle"></p>
        <ol class="steps">
          <li data-i18n="sto.step1"></li>
          <li data-i18n="sto.step2"></li>
          <li data-i18n="sto.step3"></li>
          <li data-i18n="sto.step4"></li>
          <li data-i18n="sto.step5"></li>
        </ol>
        <form id="sto-form" autocomplete="off">
          <div class="fields one">
            <label for="sto-account" data-i18n="sto.account"></label>
            <input id="sto-account" type="text" spellcheck="false" autocapitalize="off">
            <label for="sto-bucket" data-i18n="sto.bucket"></label>
            <input id="sto-bucket" type="text" spellcheck="false" autocapitalize="off">
            <label for="sto-key" data-i18n="sto.keyId"></label>
            <input id="sto-key" type="text" spellcheck="false" autocapitalize="off">
            <label for="sto-secret" data-i18n="sto.secret"></label>
            <input id="sto-secret" type="password" autocomplete="off">
          </div>
          <details>
            <summary data-i18n="sto.advanced"></summary>
            <div class="fields one">
              <label for="sto-endpoint" data-i18n="sto.endpoint"></label>
              <input id="sto-endpoint" type="text" spellcheck="false" autocapitalize="off" placeholder="https://">
              <label for="sto-region" data-i18n="sto.region"></label>
              <input id="sto-region" type="text" spellcheck="false" autocapitalize="off">
            </div>
          </details>
          <div class="actions">
            <button type="submit" class="secondary" data-i18n="sto.saveTest"></button>
          </div>
        </form>
        <ul id="sto-steps" class="rows"></ul>
      </section>

      <section class="card" data-pane="system" hidden>
        <h2 data-i18n="adm.tab.system"></h2>
        <p class="label">yt-dlp</p>
        <p class="muted" data-i18n="sys.help"></p>
        <div id="sys-tiles" class="tiles"></div>
        <p id="sys-message" class="note" hidden></p>
        <div class="checks">
          <label for="sys-auto"><input id="sys-auto" type="checkbox"><span data-i18n="sys.auto"></span></label>
        </div>
        <div class="actions">
          <button id="sys-update" type="button" data-i18n="sys.updateNow"></button>
          <button id="sys-rollback" type="button" class="quiet" hidden></button>
        </div>
        <p class="label" data-i18n="sys.platformChecks"></p>
        <p class="muted" data-i18n="sys.platformHelp"></p>
        <form id="sys-checks-form" autocomplete="off">
          <ul id="sys-checks" class="rows"></ul>
          <div class="actions">
            <button type="submit" class="secondary" data-i18n="sys.saveChecks"></button>
            <button id="sys-test-platforms" type="button" class="secondary" data-i18n="sys.testNow"></button>
          </div>
        </form>
        <p id="sys-tests-left" class="muted"></p>

        <p class="label" data-i18n="bak.title"></p>
        <p class="muted" data-i18n="bak.help"></p>
        <div id="bak-tiles" class="tiles"></div>
        <p id="bak-message" class="error" hidden></p>
        <div class="checks">
          <label for="bak-auto"><input id="bak-auto" type="checkbox"><span data-i18n="bak.auto"></span></label>
        </div>
        <div class="actions">
          <button id="bak-now" type="button" data-i18n="bak.now"></button>
        </div>
        <p class="muted" data-i18n="bak.restoreNote"></p>
      </section>

      <section class="card" data-pane="log" hidden>
        <h2 data-i18n="adm.tab.log"></h2>
        <p class="muted" data-i18n="adm.logHelp"></p>
        <ul id="adm-log" class="rows"></ul>
      </section>
    </div>
  </main>
