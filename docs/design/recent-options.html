<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent list layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=IBM+Plex+Sans:wght@400;600&family=Inter+Tight:wght@500;700;800&family=Lora:wght@400;600&family=Manrope:wght@400;600;800&family=Playfair+Display:ital,wght@1,900&family=Rubik+Mono+One&family=Special+Elite&display=swap">
<style>
/* Sketches only: layouts for the Recent list. Nothing here is wired into the app. */
* { box-sizing: border-box; }
body { margin: 0; padding: 26px 16px 48px; background: #e9e9e6; color: #1c1c1c; font: 15px/1.5 system-ui, sans-serif; }
h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
.sub { text-align: center; color: #555; margin: 0 auto 14px; max-width: 64ch; }
.looks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 auto 26px; }
.looks button { font: 600 14px system-ui, sans-serif; padding: 7px 14px; border-radius: 99px; border: 1px solid #999; background: #fff; cursor: pointer; }
.looks button[aria-pressed="true"] { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 36px 24px; max-width: 1320px; margin: 0 auto; }
.opt { display: grid; gap: 10px; justify-items: center; align-content: start; }
.opt h2 { margin: 4px 0 0; font-size: 17px; }
.opt p { margin: 0; color: #555; font-size: 14px; text-align: center; max-width: 34ch; }
.opt .pro { color: #2f6b3f; } .opt .con { color: #8a3b2e; }

.phone { width: 300px; border-radius: 36px; padding: 9px; background: #111; box-shadow: 0 16px 36px rgba(0,0,0,.18); }
.scr { border-radius: 28px; padding: 14px 12px 18px; height: 560px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-b); font-size: 13px; line-height: 1.35; }
.card { background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 12px; display: grid; gap: 0; }
.hd { font-family: var(--f-d); font-size: var(--hd-size, 18px); font-weight: var(--hd-w, 700); font-style: var(--hd-style, normal); letter-spacing: var(--hd-ls, 0); text-transform: var(--hd-tt, none); margin: 0 0 6px; }
.thumb { flex: none; border-radius: var(--r-in); border: 1px solid var(--line); background-size: cover; }
.t1 { background: linear-gradient(135deg, #f5b041, #e67e22 60%, #7b3f00); }
.t2 { background: linear-gradient(135deg, #2c3e50, #c0392b); }
.t3 { background: linear-gradient(135deg, #34495e, #95a5a6 70%, #ecf0f1); }
.t4 { background: linear-gradient(135deg, #16a085, #2c3e50); }
.t5 { background: linear-gradient(135deg, #8e44ad, #f39c12); }
.ttl { font-weight: 700; color: var(--ink); }
.meta { color: var(--soft); font-size: 11.5px; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.two { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sep { border-top: var(--sep); }
.btn { display: inline-grid; place-items: center; border-radius: var(--r-btn); font-weight: 700; font-size: 12px; white-space: nowrap; }
.primary { background: var(--acc); color: var(--acc-ink); }
.ghost { border: 1px solid var(--line); color: var(--ink); background: var(--card); }
.round { width: 34px; height: 34px; border-radius: 50%; font-size: 15px; }

/* A. One line + menu */
.a-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.a-row .thumb { width: 54px; height: 54px; }
.a-row .mid { flex: 1; min-width: 0; display: grid; gap: 2px; }
.a-menu { position: relative; }
.pop { position: absolute; right: 0; top: 40px; z-index: 2; width: 172px; padding: 6px; display: grid; gap: 2px;
  background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--r); box-shadow: 0 10px 26px rgba(0,0,0,.22); }
.pop span { padding: 8px 10px; border-radius: var(--r-in); font-weight: 600; }
.pop span:hover, .pop span.on { background: var(--hi); }

/* B. Icon bar */
.b-row { display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; padding: 10px 0; }
.b-row .thumb { width: 74px; height: 42px; grid-row: span 2; }
.b-icons { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.b-icons span { display: grid; justify-items: center; gap: 1px; padding: 5px 0; border-radius: var(--r-in); border: 1px solid var(--line); font-size: 15px; }
.b-icons span small { font-size: 10px; font-weight: 700; color: var(--soft); }
.b-icons span.primary small { color: inherit; }

/* C. Tap to open */
.c-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.c-row .thumb { width: 64px; height: 36px; }
.c-row .mid { flex: 1; min-width: 0; display: grid; gap: 1px; }
.chev { color: var(--soft); font-size: 18px; transition: transform .2s; }
.c-open { padding: 4px 0 12px; display: grid; gap: 8px; }
.c-open .wide { padding: 10px; font-size: 13px; }
.c-open .pair { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.c-open .pair .btn { padding: 8px 0; }
.c-row.open .chev { transform: rotate(90deg); }

/* D. Picture grid */
.d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.d-tile { position: relative; aspect-ratio: 4 / 5; border-radius: var(--r-in); overflow: hidden; border: 1px solid var(--line); }
.d-tile .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.78)); }
.d-tile .words { position: absolute; left: 8px; right: 8px; bottom: 7px; color: #fff; display: grid; gap: 1px; }
.d-tile .words .ttl { color: #fff; font-size: 12px; }
.d-tile .words .meta { color: rgba(255,255,255,.8); font-size: 10.5px; }
.d-tile .badge { position: absolute; top: 6px; right: 6px; padding: 2px 7px; border-radius: 99px; font-size: 10px; font-weight: 800; background: var(--acc); color: var(--acc-ink); }
.d-tile .send { position: absolute; top: 6px; left: 6px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.92); color: #111; font-size: 13px; }

/* the looks */
.zine { --bg: #efe8d8; --card: #fffdf6; --ink: #111; --soft: #4d483d; --line: #111; --acc: #e10600; --acc-ink: #fff; --hi: #ffe14d;
  --f-d: "Rubik Mono One", sans-serif; --f-b: "Special Elite", monospace; --r: 4px; --r-in: 2px; --r-btn: 2px; --bw: 2px;
  --sh: 6px 6px 0 #111; --sep: 2px dashed rgba(17,17,17,.35); --hd-size: 15px; --hd-tt: uppercase; }
.comic { --bg: #ffd60a; --card: #fff; --ink: #111; --soft: #444; --line: #111; --acc: #ef233c; --acc-ink: #fff; --hi: #bdeeff;
  --f-d: "Bangers", sans-serif; --f-b: "Comic Neue", sans-serif; --r: 14px; --r-in: 8px; --r-btn: 10px; --bw: 3px;
  --sh: 6px 6px 0 #111; --sep: 2px solid rgba(17,17,17,.2); --hd-size: 24px; --hd-ls: .04em; }
.editorial { --bg: #f6f1e7; --card: #fffdf8; --ink: #1a1714; --soft: #6e655a; --line: #cfc4b2; --acc: #b3261e; --acc-ink: #fff; --hi: #f3e7d6;
  --f-d: "Playfair Display", serif; --f-b: "Lora", serif; --r: 2px; --r-in: 2px; --r-btn: 2px; --bw: 1px; --sh: none;
  --sep: 1px solid #cfc4b2; --hd-size: 22px; --hd-w: 900; --hd-style: italic; }
.midnight { --bg: #101216; --card: #171a20; --ink: #ece7dc; --soft: #9a958a; --line: #2e333c; --acc: #c9a45c; --acc-ink: #17130a; --hi: #232831;
  --f-d: "Cormorant Garamond", serif; --f-b: "Manrope", sans-serif; --r: 14px; --r-in: 10px; --r-btn: 99px; --bw: 1px;
  --sh: 0 10px 30px rgba(0,0,0,.35); --sep: 1px solid #2e333c; --hd-size: 26px; --hd-style: italic; }
.nordic { --bg: #f3f0ea; --card: #fbfaf7; --ink: #2b2d2a; --soft: #6f7369; --line: #ddd7cb; --acc: #5f7a61; --acc-ink: #fff; --hi: #e3ebe1;
  --f-d: "Manrope", sans-serif; --f-b: "Manrope", sans-serif; --r: 22px; --r-in: 12px; --r-btn: 12px; --bw: 0px;
  --sh: 0 6px 20px rgba(70,60,40,.08); --sep: 1px solid #e7e2d8; --hd-size: 20px; --hd-w: 800; }
.studio { --bg: #e9ebee; --card: #fff; --ink: #1d2126; --soft: #646b74; --line: #dde1e6; --acc: #1d2126; --acc-ink: #fff; --hi: #fff6dd;
  --f-d: "IBM Plex Sans", sans-serif; --f-b: "IBM Plex Sans", sans-serif; --r: 16px; --r-in: 10px; --r-btn: 10px; --bw: 0px;
  --sh: 0 1px 2px rgba(20,25,35,.06), 0 8px 24px rgba(20,25,35,.07); --sep: 1px solid #eceef1; --hd-size: 19px; --hd-w: 600; }
</style>
</head>
<body>
<h1>Recent list: four tighter layouts</h1>
<p class="sub">Each phone shows the same five videos. Switch the look to see how each layout sits in it. Today every row carries three or four full-size buttons; each layout below keeps the row short and puts the rest one tap away.</p>
<div class="looks" id="looks"></div>
<div class="grid" id="grid"></div>
<script>
const LOOKS = [["zine", "Zine"], ["comic", "Comic"], ["editorial", "Editorial"], ["midnight", "Midnight"], ["nordic", "Nordic"], ["studio", "Studio"]];
const VIDEOS = [
  ["t1", "Cheech & Chong - A whole new way to chill", "480p · 0.3 MB · ✂️ 0:05–0:11", true],
  ["t2", "\"Ya me puse a dar la primicia\", funcionaria pasa incómodo momento", "480p · 2.2 MB", true],
  ["t3", "La sorprendente respuesta de Sheinbaum a periodista", "Audio · 0.9 MB", true],
  ["t4", "Ari K - THE SPY LADIES - Part 6 of EVERYTHING COMPUTER", "Fit 8 MB · 7.8 MB", true],
  ["t5", "TikTok video #7059698374567611694", "Expired", false],
];
const head = '<p class="hd">Recent</p>';

const layoutA = () => `<div class="card">${head}${VIDEOS.map(([t, title, meta, live], i) => `
  <div class="a-row ${i ? "sep" : ""}">
    <div class="thumb ${t}"></div>
    <div class="mid"><span class="ttl one">${title}</span><span class="meta one">${meta}</span></div>
    ${live ? `<span class="btn primary round" title="Send or save">↗</span>` : `<span class="btn ghost" style="padding:6px 9px">Make again</span>`}
    <span class="a-menu"><span class="btn ghost round">⋯</span>${i === 0 ? `
      <span class="pop"><span class="on">🔗 Copy link</span><span>✂️ Make a clip</span><span>⬇️ Download</span><span>↻ Make again</span></span>` : ""}</span>
  </div>`).join("")}</div>`;

const layoutB = () => `<div class="card">${head}${VIDEOS.slice(0, 4).map(([t, title, meta], i) => `
  <div class="b-row ${i ? "sep" : ""}">
    <div class="thumb ${t}"></div>
    <span class="ttl two">${title}</span>
    <span class="meta one">${meta}</span>
    <div class="b-icons"><span class="primary">↗<small>Send</small></span><span>🔗<small>Link</small></span><span>✂️<small>Clip</small></span><span>⬇️<small>Save</small></span></div>
  </div>`).join("")}</div>`;

const layoutC = () => `<div class="card">${head}${VIDEOS.map(([t, title, meta, live], i) => `
  <div class="c-row ${i ? "sep" : ""} ${i === 1 ? "open" : ""}">
    <div class="thumb ${t}"></div>
    <div class="mid"><span class="ttl one">${title}</span><span class="meta one">${meta}</span></div>
    <span class="chev">›</span>
  </div>${i === 1 ? `
  <div class="c-open">
    <span class="btn primary wide">Send or save</span>
    <div class="pair"><span class="btn ghost">🔗 Link</span><span class="btn ghost">✂️ Clip</span><span class="btn ghost">⬇️ Save</span></div>
  </div>` : ""}`).join("")}</div>`;

const layoutD = () => `<div class="card">${head}<div class="d-grid">${VIDEOS.slice(0, 4).concat([VIDEOS[0]]).slice(0, 4).map(([t, title, meta], i) => `
  <div class="d-tile ${t}"><div class="shade"></div>
    <span class="send">↗</span><span class="badge">${meta.split(" · ")[0]}</span>
    <div class="words"><span class="ttl two">${title}</span><span class="meta one">${meta.split(" · ").slice(1).join(" · ")}</span></div>
  </div>`).join("")}</div></div>`;

const OPTIONS = [
  ["A. One line and a ⋯ menu", layoutA,
   "Each row: picture, one line of title, one line of details, a Send button and ⋯. The ⋯ menu holds Copy link, Make a clip, Download and Make again.",
   "Shortest rows, so many videos fit.", "Copy link and Clip are hidden one tap away."],
  ["B. Icon bar", layoutB,
   "Every action stays visible, but as four small icons with tiny labels under each video.",
   "Nothing hidden, still tidy.", "Rows are taller; fewer videos fit."],
  ["C. Tap to open", layoutC,
   "Rows are just picture, title and details. Tap one to open it in place: Send or save, then Link, Clip and Save.",
   "Calm list, and the buttons are big when you need them.", "One extra tap for everything."],
  ["D. Picture grid", layoutD,
   "Two columns of pictures, like the Photos app. ↗ sends right away; tapping a picture opens the finished screen with every option, the player and the clip timeline.",
   "Most visual, easiest to find a video by its picture.", "Long titles get cut; needs good pictures."],
];

function paint(look) {
  document.getElementById("grid").innerHTML = OPTIONS.map(([name, layout, text, pro, con]) => `
    <div class="opt">
      <div class="phone"><div class="scr ${look}">${layout()}</div></div>
      <h2>${name}</h2><p>${text}</p><p class="pro">+ ${pro}</p><p class="con">− ${con}</p>
    </div>`).join("");
  for (const b of document.querySelectorAll("#looks button")) b.setAttribute("aria-pressed", String(b.dataset.look === look));
}
document.getElementById("looks").innerHTML = LOOKS.map(([id, name]) => `<button type="button" data-look="${id}">${name}</button>`).join("");
document.getElementById("looks").addEventListener("click", (e) => { if (e.target.dataset.look) paint(e.target.dataset.look); });
paint("zine");
</script>
</body>
</html>
