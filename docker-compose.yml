# joyshare: two containers from one image.
#   web    - the website and API
#   worker - downloads, converts, cleans up
# All data (database + videos) lives in the "joyshare_data" volume.

x-app: &app
  image: joyshare:dev
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - joyshare_data:/data

services:
  web:
    <<: *app
    build: .   # the worker reuses the image built here
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      # Reachable only from this computer by default. See JOYSHARE_BIND in .env.example.
      - "${JOYSHARE_BIND:-127.0.0.1}:${JOYSHARE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: python -m app.worker
    stop_grace_period: 30s

  # Optional: the Cloudflare Tunnel, in the same private network as the app, so it reaches it as http://web:8080.
  # Put CLOUDFLARE_TUNNEL_TOKEN in .env, then start everything with:  docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  joyshare_data:
