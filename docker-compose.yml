# joyshare: everything it runs is defined here.
#   web    - the website and API
#   worker - downloads, converts, cleans up
#   tunnel - optional: the Cloudflare Tunnel (when CLOUDFLARE_TUNNEL_TOKEN is in .env)
#   caddy  - optional: a web server with automatic https, for hosts without Cloudflare (when JOYSHARE_DOMAIN is in .env)
# All data (database + videos) lives in the "joyshare_data" volume.
#
# Use the ./joyshare script to start, stop and update: it turns the optional parts on from what is in .env.

x-app: &app
  image: joyshare:dev
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - joyshare_data:/data

services:
  web:
    <<: *app
    build: .   # the worker reuses the image built here
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      # Reachable only from this computer by default. See JOYSHARE_BIND in .env.example.
      - "${JOYSHARE_BIND:-127.0.0.1}:${JOYSHARE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: python -m app.worker
    stop_grace_period: 30s

  # Optional: the Cloudflare Tunnel, in the same private network as the app, so it reaches it as http://web:8080.
  # Put CLOUDFLARE_TUNNEL_TOKEN in .env, then:  ./joyshare start
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Optional: a web server for a host that is reachable from the internet directly (a cloud server),
  # without Cloudflare in front. It gets and renews the https certificate by itself.
  # Put JOYSHARE_DOMAIN=your-domain.example in .env, then:  ./joyshare start
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${JOYSHARE_DOMAIN:-localhost} --to web:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data       # the certificates
      - caddy_config:/config
    depends_on:
      - web

volumes:
  joyshare_data:
  caddy_data:
  caddy_config:
